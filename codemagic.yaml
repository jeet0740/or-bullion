workflows:
  ios-compile-check:
    name: OR Bullion iOS compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: npm install
      - name: Build web application
        script: npm run build
      - name: Generate iOS project and sync Capacitor
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS app without signing
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
