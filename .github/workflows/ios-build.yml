name: OR Bullion iOS Build Check

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create and sync iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS simulator app without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
