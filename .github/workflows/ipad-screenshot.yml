
name: OR Bullion USA iPad Screenshot

on:
  workflow_dispatch:

jobs:
  ipad-screenshot:
    name: Capture and Diagnose iPad Screenshot
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH=$(find /Applications -maxdepth 1 \
            -type d -name 'Xcode_26*.app' \
            | sort -V | tail -n 1)

          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 not found."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Set iOS deployment target
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/App/Podfile")
          content = podfile.read_text()

          updated, count = re.subn(
              r"(?m)^platform :ios, ['\"][^'\"]+['\"]",
              "platform :ios, '15.0'",
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not update Podfile")

          podfile.write_text(updated)
          PY

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Find 13-inch iPad
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list devices available

          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for devices in data["devices"].values():
              for device in devices:
                  if "iPad Pro 13-inch" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)

          sys.exit(1)
          ')

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Boot simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcrun simctl ui "$DEVICE_ID" appearance light

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"

          test -d "$APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print CFBundleIdentifier' \
            "$APP_PATH/Info.plist")

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          echo "Installed $BUNDLE_ID"

      - name: Check bundled web files
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"

          echo "Checking Capacitor web assets"

          find "$APP_PATH" -name index.html -print

          test -f "$APP_PATH/public/index.html" || {
            echo "WARNING: Expected Capacitor index.html not found."
          }

      - name: Prepare screenshot directory
        run: mkdir -p screenshots

      - name: Configure status bar
        shell: bash
        run: |
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --batteryState charged \
            --batteryLevel 100

      - name: Start simulator diagnostics
        shell: bash
        run: |
          nohup xcrun simctl spawn "$DEVICE_ID" \
            log stream \
            --style compact \
            --level debug \
            --predicate 'process == "App" OR process == "WebKit.WebContent" OR subsystem CONTAINS "capacitor"' \
            > screenshots/simulator-log.txt 2>&1 &

          echo $! > screenshots/log-process.pid

      - name: Launch calculator
        shell: bash
        run: |
          set -euo pipefail

          echo "Launching $BUNDLE_ID"

          xcrun simctl launch --terminate-running-process \
            "$DEVICE_ID" "$BUNDLE_ID"

          echo "Waiting 45 seconds for app startup"
          sleep 45

          echo "Checking app process"
          xcrun simctl spawn "$DEVICE_ID" launchctl list \
            | grep -F "$BUNDLE_ID" \
            || echo "WARNING: App process not found in launchctl"

      - name: Capture first screenshot
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl io "$DEVICE_ID" screenshot \
            screenshots/ipad-first.png

          sips -g pixelWidth -g pixelHeight \
            screenshots/ipad-first.png

      - name: Relaunch and capture final screenshot
        shell: bash
        run: |
          set -euo pipefail

          echo "Relaunching calculator"

          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true

          sleep 5

          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"

          sleep 45

          xcrun simctl io "$DEVICE_ID" screenshot \
            screenshots/OR-Bullion-USA-iPad-13-inch.png

          sips -g pixelWidth -g pixelHeight \
            screenshots/OR-Bullion-USA-iPad-13-inch.png

      - name: Check screenshot image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path(
              "screenshots/OR-Bullion-USA-iPad-13-inch.png"
          )

          if not path.exists():
              raise SystemExit("Screenshot was not created")

          print("Screenshot size:", path.stat().st_size, "bytes")

          subprocess.run(
              ["sips", "-g", "pixelWidth", "-g", "pixelHeight", str(path)],
              check=True
          )

          if path.stat().st_size < 30000:
              print(
                  "WARNING: Screenshot is unusually small. "
                  "It may still show a blank screen."
              )
          PY

      - name: Save simulator diagnostic information
        if: always()
        shell: bash
        run: |
          mkdir -p screenshots

          xcrun simctl list devices > \
            screenshots/simulator-devices.txt 2>&1 || true

          xcrun simctl spawn "$DEVICE_ID" launchctl list > \
            screenshots/running-processes.txt 2>&1 || true

          find ios/App/App -maxdepth 3 -type f \
            > screenshots/project-files.txt 2>&1 || true

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OR-Bullion-USA-iPad-Screenshot-Diagnostics
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
