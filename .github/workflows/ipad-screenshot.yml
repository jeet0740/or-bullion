
name: OR Bullion USA iPad Screenshot

on:
  workflow_dispatch:

jobs:
  ipad-screenshot:
    name: Capture iPad Screenshot
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          XCODE_PATH=$(find /Applications -maxdepth 1 \
            -type d -name 'Xcode_26*.app' \
            | sort -V | tail -n 1)

          if [[ -z "$XCODE_PATH" ]]; then
            echo "ERROR: Xcode 26 was not found."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcodebuild -version
          xcrun simctl list devices available

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Create and sync iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Configure minimum iOS version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/App/Podfile")
          content = podfile.read_text()

          updated, count = re.subn(
              r"(?m)^platform :ios, ['\"][^'\"]+['\"]",
              "platform :ios, '15.0'",
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("iOS platform declaration not found")

          podfile.write_text(updated)
          print("Minimum iOS version: 15.0")
          PY

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Find 13-inch iPad simulator
        shell: bash
        run: |
          set -euo pipefail

          echo "Available simulators:"
          xcrun simctl list devices available

          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for devices in data["devices"].values():
              for device in devices:
                  name = device["name"]
                  if "iPad Pro 13-inch" in name:
                      print(device["udid"])
                      sys.exit(0)

          sys.exit(1)
          ')

          if [[ -z "$DEVICE_ID" ]]; then
            echo "ERROR: No 13-inch iPad simulator found."
            exit 1
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $DEVICE_ID"

      - name: Boot iPad simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "iPad simulator ready."

      - name: Build iOS simulator application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install calculator on iPad
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "ERROR: Simulator application not found."
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print CFBundleIdentifier' \
            "$APP_PATH/Info.plist")

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          echo "Installed application: $BUNDLE_ID"

      - name: Configure screenshot status bar
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl status_bar "$DEVICE_ID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --batteryState charged \
            --batteryLevel 100

      - name: Launch OR Bullion USA
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"

          echo "Waiting for calculator to load..."
          sleep 20

      - name: Capture iPad screenshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p screenshots

          SCREENSHOT="screenshots/OR-Bullion-USA-iPad-13-inch.png"

          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT"

          echo "Screenshot saved:"
          ls -lh "$SCREENSHOT"

          echo "Screenshot dimensions:"
          sips -g pixelWidth -g pixelHeight "$SCREENSHOT"

      - name: Upload iPad screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: OR-Bullion-USA-iPad-13-inch-Screenshot
          path: screenshots/OR-Bullion-USA-iPad-13-inch.png
          if-no-files-found: error
          retention-days: 7
