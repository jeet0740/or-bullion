name: OR Bullion USA iPad App Store Screenshots

on:
  workflow_dispatch:

jobs:
  ipad-screenshots:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build app
        run: |
          npm ci
          npm run build

      - name: Install browser for screenshot capture
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start local app preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/orbullion-preview.log 2>&1 &
          echo $! > /tmp/orbullion-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/orbullion-preview.log
          exit 1

      - name: Capture actual app UI at iPad 13-inch screenshot dimensions
        run: |
          mkdir -p ipad-screenshots
          cat > capture-ipad.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1032, height: 1376 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            colorScheme: 'dark'
          });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.locator('.metalTabs button').first().waitFor();
          for (const metal of ['Gold', 'Silver', 'Platinum']) {
            await page.getByRole('button', { name: metal, exact: true }).first().click();
            await page.waitForTimeout(1200);
            const file = 'ipad-screenshots/OR-Bullion-iPad-' + metal + '.png';
            await page.screenshot({ path: file, fullPage: false, animations: 'disabled' });
            console.log('Saved ' + file);
          }
          await browser.close();
          JS
          node capture-ipad.mjs

      - name: Validate PNG screenshot dimensions
        run: |
          for file in ipad-screenshots/*.png; do
            echo "$file"
            sips -g pixelWidth -g pixelHeight "$file"
            test "$(sips -g pixelWidth "$file" | awk '/pixelWidth:/{print $2}')" = 2064
            test "$(sips -g pixelHeight "$file" | awk '/pixelHeight:/{print $2}')" = 2752
          done

      - name: Downloadable iPad screenshot files
        uses: actions/upload-artifact@v4
        with:
          name: OR-Bullion-USA-iPad-13inch-Screenshots
          path: ipad-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
